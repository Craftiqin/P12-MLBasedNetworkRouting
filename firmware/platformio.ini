[platformio]
default_envs = node_01, node_02, node_03, node_04

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SH110X

[env:node_01]
build_flags = ${env.build_flags} -DP12_NODE_ID=1

[env:node_02]
build_flags = ${env.build_flags} -DP12_NODE_ID=2

[env:node_03]
build_flags = ${env.build_flags} -DP12_NODE_ID=3

[env:node_04]
build_flags = ${env.build_flags} -DP12_NODE_ID=4
