<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100"><rect width="1800" height="1100" fill="white"/><text x="900" y="50" text-anchor="middle" font-family="Arial" font-size="36" font-weight="bold" fill="#172b4d">Proposed four-node IoT routing and power architecture</text><text x="900" y="88" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#a23b2a">DESIGN PLAN — NOT ASSEMBLED OR ELECTRICALLY VERIFIED</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#496581"/></marker></defs><rect x="80" y="215" width="360" height="205" rx="16" fill="#eaf4ff" stroke="#3d6c99" stroke-width="3"/><text x="260" y="250" text-anchor="middle" font-family="Arial" font-size="26" fill="#172b4d" font-weight="bold">NODE 1 · SOURCE</text><text x="260" y="294" text-anchor="middle" font-family="Arial" font-size="19" fill="#263746" font-weight="normal">ESP32 DevKit V1 · 38-pin</text><text x="260" y="325" text-anchor="middle" font-family="Arial" font-size="19" fill="#263746" font-weight="normal">DHT11 · LDR · sound sensor</text><text x="260" y="356" text-anchor="middle" font-family="Arial" font-size="19" fill="#263746" font-weight="normal">1.3-inch 128×64 I²C OLED</text><text x="260" y="387" text-anchor="middle" font-family="Arial" font-size="19" fill="#263746" font-weight="normal">Traffic-light indicator</text><rect x="620" y="145" width="350" height="145" rx="16" fill="#eaf4ff" stroke="#3d6c99" stroke-width="3"/><text x="795" y="182" text-anchor="middle" font-family="Arial" font-size="25" fill="#172b4d" font-weight="bold">NODE 2 · RELAY</text><text x="795" y="222" text-anchor="middle" font-family="Arial" font-size="19" fill="#263746" font-weight="normal">ESP32 DevKit V1 · 38-pin</text><text x="795" y="253" text-anchor="middle" font-family="Arial" font-size="19" fill="#263746" font-weight="normal">Traffic-light indicator</text><rect x="620" y="365" width="350" height="145" rx="16" fill="#eaf4ff" stroke="#3d6c99" stroke-width="3"/><text x="795" y="402" text-anchor="middle" font-family="Arial" font-size="25" fill="#172b4d" font-weight="bold">NODE 3 · RELAY</text><text x="795" y="442" text-anchor="middle" font-family="Arial" font-size="19" fill="#263746" font-weight="normal">ESP32 DevKit V1 · 38-pin</text><text x="795" y="473" text-anchor="middle" font-family="Arial" font-size="19" fill="#263746" font-weight="normal">Traffic-light indicator</text><rect x="1190" y="245" width="340" height="160" rx="16" fill="#eaf4ff" stroke="#3d6c99" stroke-width="3"/><text x="1360" y="282" text-anchor="middle" font-family="Arial" font-size="25" fill="#172b4d" font-weight="bold">NODE 4 · DESTINATION</text><text x="1360" y="324" text-anchor="middle" font-family="Arial" font-size="19" fill="#263746" font-weight="normal">ESP32 DevKit V1 · 38-pin</text><text x="1360" y="356" text-anchor="middle" font-family="Arial" font-size="19" fill="#263746" font-weight="normal">Traffic-light indicator</text><path d="M440 260 L620 215" stroke="#496581" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M440 360 L620 435" stroke="#496581" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M970 215 L1190 285" stroke="#496581" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M970 435 L1190 350" stroke="#496581" stroke-width="5" fill="none" marker-end="url(#a)"/><rect x="1190" y="430" width="430" height="62" rx="12" fill="#f4efff" stroke="#7858a6" stroke-width="3"/><text x="1405" y="450" text-anchor="middle" font-family="Arial" font-size="18" fill="#263746" font-weight="bold">FastAPI backend / logger · planned</text><path d="M1360 405 L1360 430" stroke="#7858a6" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M70 535 H1730" stroke="#b8c6d3" stroke-width="2"/><text x="900" y="575" text-anchor="middle" font-family="Arial" font-size="28" fill="#172b4d" font-weight="bold">Proposed battery-to-node power architecture</text><rect x="40" y="625" width="235" height="145" rx="14" fill="#fff4dd" stroke="#bc8b35" stroke-width="3"/><text x="157.5" y="663" text-anchor="middle" font-family="Arial" font-size="20" fill="#263746" font-weight="bold">4 × 18650 cells</text><text x="157.5" y="703" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">3.7 V · 2000 mAh</text><text x="157.5" y="734" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">2 dual-cell holders*</text><rect x="295" y="625" width="235" height="145" rx="14" fill="#fff4dd" stroke="#bc8b35" stroke-width="3"/><text x="412.5" y="663" text-anchor="middle" font-family="Arial" font-size="20" fill="#263746" font-weight="bold">4S BMS</text><text x="412.5" y="703" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">balance + protection</text><text x="412.5" y="734" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">rating/spec to verify</text><rect x="550" y="625" width="235" height="145" rx="14" fill="#fff4dd" stroke="#bc8b35" stroke-width="3"/><text x="667.5" y="663" text-anchor="middle" font-family="Arial" font-size="20" fill="#263746" font-weight="bold">Main switch</text><text x="667.5" y="703" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">battery disconnect</text><text x="667.5" y="734" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">DC rating to verify</text><rect x="1060" y="625" width="270" height="145" rx="14" fill="#fff4dd" stroke="#bc8b35" stroke-width="3"/><text x="1195.0" y="663" text-anchor="middle" font-family="Arial" font-size="20" fill="#263746" font-weight="bold">4 × LM2596 modules</text><text x="1195.0" y="703" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">parallel inputs only</text><text x="1195.0" y="734" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">each set to 5.0 V</text><rect x="1375" y="625" width="385" height="145" rx="14" fill="#fff4dd" stroke="#bc8b35" stroke-width="3"/><text x="1567.5" y="663" text-anchor="middle" font-family="Arial" font-size="20" fill="#263746" font-weight="bold">Four separate regulated outputs</text><text x="1567.5" y="703" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">one buck per ESP32 board</text><text x="1567.5" y="734" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">outputs NOT tied together</text><path d="M275 698 L295 698" stroke="#496581" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M530 698 L550 698" stroke="#496581" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M785 698 L1060 698" stroke="#496581" stroke-width="5" fill="none" marker-end="url(#a)"/><path d="M1330 698 L1375 698" stroke="#496581" stroke-width="5" fill="none" marker-end="url(#a)"/><rect x="145" y="825" width="670" height="130" rx="16" fill="#eef7ec" stroke="#5b8a54" stroke-width="3"/><text x="480" y="860" text-anchor="middle" font-family="Arial" font-size="22" fill="#263746" font-weight="bold">Pack design arithmetic</text><text x="480" y="895" text-anchor="middle" font-family="Arial" font-size="18" fill="#263746" font-weight="normal">14.8 V nominal · 16.8 V full · 2000 mAh series capacity</text><text x="480" y="927" text-anchor="middle" font-family="Arial" font-size="18" fill="#263746" font-weight="normal">29.6 Wh nominal · 4S CC/CV charger required</text><rect x="865" y="825" width="800" height="130" rx="16" fill="#fff0ee" stroke="#bd5a50" stroke-width="3"/><text x="1265" y="860" text-anchor="middle" font-family="Arial" font-size="22" fill="#8c3028" font-weight="bold">Commissioning gates</text><text x="1265" y="895" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">Verify matched cells, holder wiring, BMS schematic/rating and charger voltage</text><text x="1265" y="927" text-anchor="middle" font-family="Arial" font-size="17" fill="#263746" font-weight="normal">No fuse in current design; verify wiring, BMS and current limits before energizing</text><text x="900" y="1020" text-anchor="middle" font-family="Arial" font-size="16" fill="#555" font-weight="normal">*Holder terminal arrangement and BMS cell taps must be verified. BMS is not a charger. No fuse is included; this removes an overcurrent-protection layer. No direct 4S-to-ESP32 connection.</text></svg>