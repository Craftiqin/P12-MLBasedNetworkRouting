[General]
network = p12ganesh.mesh.IoTMeshNetwork
sim-time-limit = 60s
seed-set = 17
simtime-resolution = ns
*.numNodes = 6
*.scenarioManager.script = xml("<scenario/>")

# INET AODV example radio model: deterministic unit-disk reception with
# explicit range. Physical RSSI is not inferred from this idealized model.
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
**.hasStatus = true
**.mobility.typename = "StationaryMobility"
**.mobility.initFromDisplayString = false
**.mobility.initialZ = 0m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 720m
**.mobility.constraintAreaMaxY = 520m
**.wlan[*].typename = "AckingWirelessInterface"
**.wlan[*].bitrate = 2Mbps
**.wlan[*].radio.typename = "GenericRadio"
**.wlan[*].radio.antenna.mobilityModule = "^.^.^.mobility"
**.wlan[*].radio.antenna.mobility.updateFromDisplayString = false
**.wlan[*].radio.antenna.mobility.updateDisplayString = false
**.wlan[*].radio.signalAnalogRepresentation = "unitDisk"
**.wlan[*].radio.transmitter.analogModel.communicationRange = 230m
**.wlan[*].radio.transmitter.analogModel.interferenceRange = 0m
**.wlan[*].radio.transmitter.analogModel.detectionRange = 0m
**.wlan[*].radio.receiver.ignoreInterference = true
*.configurator.addStaticRoutes = false
*.configurator.config = xml("<config><interface hosts='node[*]' names='wlan*' address='10.0.x.x' netmask='255.255.0.0'/></config>")

# Six fixed nodes; source and gateway are separated by two viable 3-hop corridors.
*.node[0].wlan[0].radio.antenna.mobility.initialX = 100m
*.node[0].wlan[0].radio.antenna.mobility.initialY = 250m
*.node[1].wlan[0].radio.antenna.mobility.initialX = 240m
*.node[1].wlan[0].radio.antenna.mobility.initialY = 120m
*.node[2].wlan[0].radio.antenna.mobility.initialX = 380m
*.node[2].wlan[0].radio.antenna.mobility.initialY = 70m
*.node[3].wlan[0].radio.antenna.mobility.initialX = 250m
*.node[3].wlan[0].radio.antenna.mobility.initialY = 350m
*.node[4].wlan[0].radio.antenna.mobility.initialX = 400m
*.node[4].wlan[0].radio.antenna.mobility.initialY = 350m
*.node[5].wlan[0].radio.antenna.mobility.initialX = 500m
*.node[5].wlan[0].radio.antenna.mobility.initialY = 250m

*.node[0].display-name = "GATEWAY"
*.node[0].display-string = "i=device/server"
*.node[0].mobility.initialX = 100m
*.node[0].mobility.initialY = 250m
*.node[1].display-name = "RELAY A1"
*.node[1].display-string = "i=device/cellphone"
*.node[1].mobility.initialX = 240m
*.node[1].mobility.initialY = 120m
*.node[2].display-name = "RELAY A2"
*.node[2].display-string = "i=device/cellphone"
*.node[2].mobility.initialX = 380m
*.node[2].mobility.initialY = 70m
*.node[3].display-name = "RELAY B1"
*.node[3].display-string = "i=device/cellphone"
*.node[3].mobility.initialX = 250m
*.node[3].mobility.initialY = 350m
*.node[4].display-name = "RELAY B2"
*.node[4].display-string = "i=device/cellphone"
*.node[4].mobility.initialX = 400m
*.node[4].mobility.initialY = 350m
*.node[5].display-name = "SOURCE"
*.node[5].display-string = "i=device/sensor"
*.node[5].mobility.initialX = 500m
*.node[5].mobility.initialY = 250m

# One-way UDP application traffic; sequence number and packet creation time
# are recorded by INET's UdpBasicApp/UdpSink statistics.
*.node[5].numApps = 1
*.node[5].app[0].typename = "UdpBasicApp"
*.node[5].app[0].destAddresses = "node[0]"
*.node[5].app[0].destPort = 5000
*.node[5].app[0].messageLength = 128B
*.node[5].app[0].sendInterval = 200ms
*.node[5].app[0].startTime = 2s
*.node[5].app[0].stopTime = 58s
*.node[5].app[0].packetName = "MeshData"
*.node[5].app[0].timeToLive = 8
*.node[0].numApps = 1
*.node[0].app[0].typename = "UdpSink"
*.node[0].app[0].localPort = 5000

# Record receive/send counts, packet sizes, delay, throughput samples, and
# sequence numbers. Router-table changes are written to a companion .rt file.
**.app[*].packetSent.result-recording-modes = all
**.app[*].packetReceived.result-recording-modes = all
**.app[*].endToEndDelay.result-recording-modes = all
**.app[*].throughput.result-recording-modes = all
**.app[*].rcvdPkSeqNo.result-recording-modes = all
*.visualizer.routingTableVisualizer.displayRoutingTables = false
*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.networkRouteVisualizer.packetFilter = "MeshData*"
*.visualizer.networkRouteVisualizer.lineColor = "green"
*.visualizer.networkRouteVisualizer.lineWidth = 3
*.visualizer.networkRouteVisualizer.lineShift = 6
*.visualizer.networkRouteVisualizer.labelFormat = ""
*.visualizer.networkRouteVisualizer.fadeOutMode = "simulationTime"
*.visualizer.networkRouteVisualizer.fadeOutTime = 3s
*.visualizer.physicalLinkVisualizer.displayLinks = false
*.visualizer.packetDropVisualizer.displayPacketDrops = true
*.routingTableRecorder.enabled = true
**.cmdenv-log-level = "WARN"
*.routingTableRecorder.logfile = "simulations/mesh/results/${configname}-#${runnumber}.rt"
output-scalar-file = "results/${configname}-#${runnumber}.sca"
output-vector-file = "results/${configname}-#${runnumber}.vec"

[Config Normal]
description = "Normal fixed topology, AODV baseline"

[Config CleanVisualDemo]
extends = Normal
description = "Short clean Qtenv demonstration of actual AODV packet routes"
sim-time-limit = 20s
*.node[5].app[0].stopTime = 18s

[Config DegradedPath]
description = "Reduced unit-disk range removes longer upper-corridor links"
**.wlan[*].radio.transmitter.analogModel.communicationRange = 190m

[Config IncreasedInterference]
description = "Competing traffic and radio interference raise loss under load"
*.node[1].numApps = 1
*.node[1].app[0].typename = "UdpBasicApp"
*.node[1].app[0].destAddresses = "node[0]"
*.node[1].app[0].destPort = 5001
*.node[1].app[0].messageLength = 1200B
*.node[1].app[0].sendInterval = 2ms
*.node[1].app[0].startTime = 5s
*.node[1].app[0].stopTime = 58s
*.node[1].app[0].packetName = "CompetingData"
*.node[0].numApps = 2
*.node[0].app[1].typename = "UdpSink"
*.node[0].app[1].localPort = 5001
**.wlan[*].radio.receiver.ignoreInterference = false
**.wlan[*].radio.transmitter.analogModel.interferenceRange = 450m

[Config IncreasedPacketLoss]
extends = IncreasedInterference
description = "Higher offered load stresses shared channel; contention may increase loss"
*.node[1].app[0].sendInterval = 500us

[Config HighLatency]
description = "Lower PHY bitrate increases actual serialization and queue delay"
**.wlan[*].bitrate = 100kbps

[Config Congestion]
description = "Second relay-to-gateway flow competes for shared wireless channel"
*.node[4].numApps = 1
*.node[4].app[0].typename = "UdpBasicApp"
*.node[4].app[0].destAddresses = "node[0]"
*.node[4].app[0].destPort = 5001
*.node[4].app[0].messageLength = 1000B
*.node[4].app[0].sendInterval = 5ms
*.node[4].app[0].startTime = 5s
*.node[4].app[0].stopTime = 58s
*.node[4].app[0].packetName = "CompetingData"
*.node[0].numApps = 2
*.node[0].app[1].typename = "UdpSink"
*.node[0].app[1].localPort = 5001
**.wlan[*].radio.receiver.ignoreInterference = false
**.wlan[*].radio.transmitter.analogModel.interferenceRange = 450m

[Config RelayFailure]
description = "Crash relay-a1 mid-run; AODV must discover surviving route"
*.scenarioManager.script = xmldoc("scenarios/relay_failure.xml")

[Config PreferredPathFailure]
description = "Crash relay-a2 mid-run; route changes to alternate corridor"
*.scenarioManager.script = xmldoc("scenarios/preferred_path_failure.xml")

[Config LinkRecovery]
description = "Crash then restart relay-a2; record AODV route repair and delivery"
*.scenarioManager.script = xmldoc("scenarios/link_recovery.xml")

[Config CustomForwardingDiagnostic]
extends = Normal
description = "Diagnostic custom UDP next-hop forwarding; not yet authoritative"
*.node[*].numApps = 1
*.node[*].app[0].typename = "MeshRoutingApp"
*.node[*].app[0].localPort = 5000
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = 128B
*.node[*].app[0].sendInterval = 200ms
*.node[*].app[0].startTime = 2s
*.node[*].app[0].stopTime = 58s
*.node[*].app[0].strategy = "baseline"
*.routingTableRecorder.enabled = false
output-scalar-file = "../../diagnostics/custom_router_unverified/results/${configname}-#${runnumber}.sca"
output-vector-file = "../../diagnostics/custom_router_unverified/results/${configname}-#${runnumber}.vec"
*.node[*].app[0].stopTime = 58s

[Config CustomForwardingShortDebug]
extends = CustomForwardingDiagnostic
description = "Short forwarding debug run for destination-tag diagnosis"
*.node[*].app[0].stopTime = 2.5s
*.node[0].app[0].typename = "MeshRoutingApp"
*.node[5].app[0].typename = "MeshRoutingApp"

[Config CustomForwardingRouteDebug]
extends = CustomForwardingShortDebug
description = "Short forwarding run with routing-table trace"
*.routingTableRecorder.enabled = true
**.cmdenv-log-level = "WARN"
*.routingTableRecorder.logfile = "../../diagnostics/custom_router_unverified/results/${configname}-#${runnumber}.rt"

[Config CustomForwardingEventDebug]
extends = CustomForwardingShortDebug
description = "Short forwarding run with OMNeT++ event log"
record-eventlog = true
eventlog-file = "../../diagnostics/custom_router_unverified/results/${configname}-#${runnumber}.elog"

[Config CustomForwardingTagDebug]
extends = CustomForwardingEventDebug
description = "Test explicit L3 address request replacement on each forwarding hop"

[Config MLRouting]
extends = Normal
description = "Decision Tree route choice using explicit decision-time path estimates"
*.node[*].numApps = 1
*.node[*].app[0].typename = "MeshRoutingApp"
*.node[*].app[0].localPort = 5000
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = 128B
*.node[*].app[0].sendInterval = 200ms
*.node[*].app[0].strategy = "ml"
*.node[*].app[0].cmdenv-log-level = "INFO"
*.node[*].app[0].maxHops = 4
*.node[*].app[0].eventLog = ""
*.node[*].app[0].upperPdrEstimate = 0.985
*.node[*].app[0].upperLatencyEstimateMs = 34
*.node[*].app[0].lowerPdrEstimate = 0.955
*.node[*].app[0].lowerLatencyEstimateMs = 47
*.routingTableRecorder.enabled = false

[Config MLRoutePreference]
extends = MLRouting
description = "Healthy physical topology; controlled upper-route degradation features should select lower corridor"
*.node[5].app[0].upperPdrEstimate = 0.79
*.node[5].app[0].upperLatencyEstimateMs = 31
*.node[5].app[0].lowerPdrEstimate = 0.955
*.node[5].app[0].lowerLatencyEstimateMs = 54

[Config MLPreferredPathFailure]
extends = MLRouting
description = "Crash upper-path relay A2 without restart; Decision Tree must reject unavailable corridor and keep using lower path"
*.scenarioManager.script = xmldoc("scenarios/ml_path_failure.xml")

[Config MLLinkRecovery]
extends = MLRouting
description = "Crash and restart upper-path relay A2; active end-to-end probe gates route re-eligibility"
*.scenarioManager.script = xmldoc("scenarios/ml_link_recovery.xml")

[Config AODVPreferredPathFailure]
extends = Normal
description = "AODV matched relay crash-only scenario for MLPreferredPathFailure"
*.scenarioManager.script = xmldoc("scenarios/ml_path_failure.xml")

[Config AODVLinkRecovery]
extends = Normal
description = "AODV matched relay crash-and-restart scenario for MLLinkRecovery"
*.scenarioManager.script = xmldoc("scenarios/ml_link_recovery.xml")

[Config MLDegradedReliability]
extends = MLRouting
description = "Competing heavy UDP flow raises shared-medium contention on both route corridors"
*.node[1].numApps = 2
*.node[1].app[1].typename = "UdpBasicApp"
*.node[1].app[1].destAddresses = "node[0]"
*.node[1].app[1].destPort = 5001
*.node[1].app[1].messageLength = 1000B
*.node[1].app[1].sendInterval = 5ms
*.node[1].app[1].startTime = 5s
*.node[1].app[1].stopTime = 58s
*.node[1].app[1].packetName = "ContendingData"
*.node[0].numApps = 2
*.node[0].app[1].typename = "UdpSink"
*.node[0].app[1].localPort = 5001
**.wlan[*].radio.receiver.ignoreInterference = false
**.wlan[*].radio.transmitter.analogModel.interferenceRange = 450m
*.node[5].app[0].upperPdrEstimate = 0.88
*.node[5].app[0].lowerPdrEstimate = 0.93

[Config AODVDegradedReliability]
extends = Normal
description = "AODV matched competing heavy UDP flow raises shared-medium contention on both corridors"
*.node[1].numApps = 1
*.node[1].app[0].typename = "UdpBasicApp"
*.node[1].app[0].destAddresses = "node[0]"
*.node[1].app[0].destPort = 5001
*.node[1].app[0].messageLength = 1000B
*.node[1].app[0].sendInterval = 5ms
*.node[1].app[0].startTime = 5s
*.node[1].app[0].stopTime = 58s
*.node[1].app[0].packetName = "ContendingData"
*.node[0].numApps = 2
*.node[0].app[1].typename = "UdpSink"
*.node[0].app[1].localPort = 5001
**.wlan[*].radio.receiver.ignoreInterference = false
**.wlan[*].radio.transmitter.analogModel.interferenceRange = 450m

[Config MLIncreasedLatency]
extends = MLRouting
description = "Lower radio bitrate increases actual per-hop serialization latency"
*.node[*].wlan[0].bitrate = 250kbps
*.node[5].app[0].upperLatencyEstimateMs = 45
*.node[5].app[0].lowerLatencyEstimateMs = 55

[Config AODVIncreasedLatency]
extends = Normal
description = "AODV matched lower radio bitrate increases actual per-hop serialization latency"
*.node[*].wlan[0].bitrate = 250kbps

[Config MLNoRoute]
extends = MLRouting
description = "Crash one relay on each corridor; Decision Tree must drop when no route remains"
*.scenarioManager.script = xmldoc("scenarios/both_routes_failure.xml")
