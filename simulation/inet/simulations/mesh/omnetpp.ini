[General]
network = p12ganesh.mesh.IoTMeshNetwork
sim-time-limit = 60s
seed-set = 17
simtime-resolution = ns
*.numNodes = 6
*.scenarioManager.script = xml("<scenario/>")

# INET AODV example radio model: deterministic unit-disk reception with
# explicit range. Physical RSSI is not inferred from this idealized model.
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
**.hasStatus = true
**.mobility.typename = "StationaryMobility"
**.mobility.initFromDisplayString = false
**.mobility.initialZ = 0m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMaxX = 720m
**.mobility.constraintAreaMaxY = 520m
**.wlan[*].typename = "AckingWirelessInterface"
**.wlan[*].bitrate = 2Mbps
**.wlan[*].radio.typename = "GenericRadio"
**.wlan[*].radio.signalAnalogRepresentation = "unitDisk"
**.wlan[*].radio.transmitter.analogModel.communicationRange = 230m
**.wlan[*].radio.transmitter.analogModel.interferenceRange = 0m
**.wlan[*].radio.transmitter.analogModel.detectionRange = 0m
**.wlan[*].radio.receiver.ignoreInterference = true
*.configurator.addStaticRoutes = false
*.configurator.config = xml("<config><interface hosts='node[*]' names='wlan*' address='10.0.x.x' netmask='255.255.255.0'/></config>")

# Six fixed nodes; source and gateway are separated by two viable 3-hop corridors.
*.node[0].display-name = "gateway"
*.node[0].display-string = "i=device/server"
*.node[0].mobility.initialX = 100m
*.node[0].mobility.initialY = 250m
*.node[1].display-name = "relay-a1"
*.node[1].mobility.initialX = 240m
*.node[1].mobility.initialY = 250m
*.node[2].display-name = "relay-a2"
*.node[2].mobility.initialX = 380m
*.node[2].mobility.initialY = 70m
*.node[3].display-name = "relay-b1"
*.node[3].mobility.initialX = 250m
*.node[3].mobility.initialY = 350m
*.node[4].display-name = "relay-b2"
*.node[4].mobility.initialX = 400m
*.node[4].mobility.initialY = 350m
*.node[5].display-name = "source"
*.node[5].display-string = "i=device/sensor"
*.node[5].mobility.initialX = 500m
*.node[5].mobility.initialY = 250m

# One-way UDP application traffic; sequence number and packet creation time
# are recorded by INET's UdpBasicApp/UdpSink statistics.
*.node[5].numApps = 1
*.node[5].app[0].typename = "UdpBasicApp"
*.node[5].app[0].destAddresses = "node[0]"
*.node[5].app[0].destPort = 5000
*.node[5].app[0].messageLength = 128B
*.node[5].app[0].sendInterval = 200ms
*.node[5].app[0].startTime = 2s
*.node[5].app[0].stopTime = 58s
*.node[5].app[0].packetName = "MeshData"
*.node[5].app[0].timeToLive = 8
*.node[0].numApps = 1
*.node[0].app[0].typename = "UdpSink"
*.node[0].app[0].localPort = 5000

# Record receive/send counts, packet sizes, delay, throughput samples, and
# sequence numbers. Router-table changes are written to a companion .rt file.
**.app[*].packetSent.result-recording-modes = all
**.app[*].packetReceived.result-recording-modes = all
**.app[*].endToEndDelay.result-recording-modes = all
**.app[*].throughput.result-recording-modes = all
**.app[*].rcvdPkSeqNo.result-recording-modes = all
*.visualizer.routingTableVisualizer.displayRoutingTables = true
*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.networkRouteVisualizer.packetFilter = "MeshData*"
*.visualizer.physicalLinkVisualizer.displayLinks = true
*.visualizer.packetDropVisualizer.displayPacketDrops = true
*.routingTableRecorder.enabled = true
routinglog-file = "results/${configname}-#${runnumber}.rt"
output-scalar-file = "results/${configname}-#${runnumber}.sca"
output-vector-file = "results/${configname}-#${runnumber}.vec"

[Config Normal]
description = "Normal fixed topology, AODV baseline"

[Config DegradedPath]
description = "Reduced unit-disk range removes longer upper-corridor links"
**.wlan[*].radio.transmitter.analogModel.communicationRange = 190m

[Config IncreasedInterference]
description = "Competing traffic and radio interference raise loss under load"
*.node[1].numApps = 1
*.node[1].app[0].typename = "UdpBasicApp"
*.node[1].app[0].destAddresses = "node[0]"
*.node[1].app[0].destPort = 5001
*.node[1].app[0].messageLength = 1200B
*.node[1].app[0].sendInterval = 2ms
*.node[1].app[0].startTime = 5s
*.node[1].app[0].stopTime = 58s
*.node[1].app[0].packetName = "CompetingData"
*.node[0].numApps = 2
*.node[0].app[1].typename = "UdpSink"
*.node[0].app[1].localPort = 5001
**.wlan[*].radio.receiver.ignoreInterference = false
**.wlan[*].radio.transmitter.analogModel.interferenceRange = 450m

[Config IncreasedPacketLoss]
extends = IncreasedInterference
description = "Higher offered load stresses shared channel; contention may increase loss"
*.node[1].app[0].sendInterval = 500us

[Config HighLatency]
description = "Lower PHY bitrate increases actual serialization and queue delay"
**.wlan[*].bitrate = 100kbps

[Config Congestion]
description = "Second relay-to-gateway flow competes for shared wireless channel"
*.node[4].numApps = 1
*.node[4].app[0].typename = "UdpBasicApp"
*.node[4].app[0].destAddresses = "node[0]"
*.node[4].app[0].destPort = 5001
*.node[4].app[0].messageLength = 1000B
*.node[4].app[0].sendInterval = 5ms
*.node[4].app[0].startTime = 5s
*.node[4].app[0].stopTime = 58s
*.node[4].app[0].packetName = "CompetingData"
*.node[0].numApps = 2
*.node[0].app[1].typename = "UdpSink"
*.node[0].app[1].localPort = 5001
**.wlan[*].radio.receiver.ignoreInterference = false
**.wlan[*].radio.transmitter.analogModel.interferenceRange = 450m

[Config RelayFailure]
description = "Crash relay-a1 mid-run; AODV must discover surviving route"
*.scenarioManager.script = xmldoc("scenarios/relay_failure.xml")

[Config PreferredPathFailure]
description = "Crash relay-a2 mid-run; route changes to alternate corridor"
*.scenarioManager.script = xmldoc("scenarios/preferred_path_failure.xml")

[Config LinkRecovery]
description = "Crash then restart relay-a2; record AODV route repair and delivery"
*.scenarioManager.script = xmldoc("scenarios/link_recovery.xml")
